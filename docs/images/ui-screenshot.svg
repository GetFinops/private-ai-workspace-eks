<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Private AI Workspace UI">
  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ee6a5f"/><stop offset="1" stop-color="#c94f45"/>
    </linearGradient>
    <clipPath id="win"><rect x="8" y="8" width="1184" height="734" rx="14"/></clipPath>
  </defs>

  <rect width="1200" height="750" fill="#0d0e12"/>
  <rect x="8" y="8" width="1184" height="734" rx="14" fill="#1f2229" stroke="#2c313c"/>

  <g clip-path="url(#win)">
    <!-- ── Sidebar ─────────────────────────────────────────── -->
    <rect x="8" y="8" width="240" height="734" fill="#15171c"/>
    <!-- brand -->
    <rect x="32" y="34" width="22" height="22" rx="7" fill="url(#coral)"/>
    <rect x="38" y="40" width="10" height="10" rx="2" fill="#fff" opacity="0.9" transform="rotate(45 43 45)"/>
    <text x="64" y="50" fill="#e8ecf1" font-size="15" font-weight="600" font-family="Fira Code,Consolas,monospace">Private AI</text>
    <!-- new chat -->
    <rect x="28" y="72" width="192" height="38" rx="10" fill="#ee6a5f"/>
    <text x="124" y="96" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">+  New chat</text>

    <!-- nav items -->
    <g font-size="13">
      <!-- active: Chat -->
      <rect x="20" y="124" width="208" height="32" rx="8" fill="#ee6a5f" opacity="0.16"/>
      <rect x="34" y="133" width="15" height="15" rx="4" fill="none" stroke="#ee6a5f" stroke-width="1.4"/>
      <text x="61" y="145" fill="#ee6a5f">Chat</text>
      <g fill="#8892a0">
        <rect x="34" y="169" width="15" height="15" rx="4" fill="none" stroke="#8892a0" stroke-width="1.3"/><text x="61" y="181">Documents</text>
        <rect x="34" y="203" width="15" height="15" rx="4" fill="none" stroke="#8892a0" stroke-width="1.3"/><text x="61" y="215">Memory</text>
        <rect x="34" y="237" width="15" height="15" rx="4" fill="none" stroke="#8892a0" stroke-width="1.3"/><text x="61" y="249">Notes</text>
        <rect x="34" y="271" width="15" height="15" rx="4" fill="none" stroke="#8892a0" stroke-width="1.3"/><text x="61" y="283">Compare</text>
        <rect x="34" y="305" width="15" height="15" rx="4" fill="none" stroke="#8892a0" stroke-width="1.3"/><text x="61" y="317">Agent</text>
        <rect x="34" y="339" width="15" height="15" rx="4" fill="none" stroke="#8892a0" stroke-width="1.3"/><text x="61" y="351">Media</text>
        <rect x="34" y="373" width="15" height="15" rx="4" fill="none" stroke="#8892a0" stroke-width="1.3"/><text x="61" y="385">Calendar</text>
        <rect x="34" y="407" width="15" height="15" rx="4" fill="none" stroke="#8892a0" stroke-width="1.3"/><text x="61" y="419">Models</text>
      </g>
    </g>
    <!-- chats -->
    <line x1="28" y1="448" x2="220" y2="448" stroke="#2c313c"/>
    <text x="30" y="470" fill="#8892a0" font-size="10.5" letter-spacing="1.2">CHATS</text>
    <text x="34" y="496" fill="#8892a0" font-size="13">Q3 board deck outline</text>
    <text x="34" y="522" fill="#8892a0" font-size="13">Refactor auth middleware</text>
    <!-- footer -->
    <line x1="8" y1="698" x2="248" y2="698" stroke="#2c313c"/>
    <circle cx="40" cy="720" r="8" fill="none" stroke="#8892a0" stroke-width="1.3"/>
    <text x="56" y="724" fill="#8892a0" font-size="12">michael@hostingx.co.il</text>
    <rect x="196" y="710" width="20" height="20" rx="5" fill="none" stroke="#8892a0" stroke-width="1.2"/>
    <rect x="222" y="710" width="20" height="20" rx="5" fill="none" stroke="#8892a0" stroke-width="1.2"/>

    <!-- ── Topbar ──────────────────────────────────────────── -->
    <line x1="248" y1="58" x2="1192" y2="58" stroke="#2c313c"/>
    <g stroke="#8892a0" stroke-width="1.6"><line x1="272" y1="29" x2="288" y2="29"/><line x1="272" y1="34" x2="288" y2="34"/><line x1="272" y1="39" x2="288" y2="39"/></g>
    <text x="304" y="39" fill="#e8ecf1" font-size="13" font-weight="600">Chat</text>
    <circle cx="1120" cy="34" r="9" fill="none" stroke="#8892a0" stroke-width="1.5"/>
    <rect x="1148" y="24" width="44" height="20" rx="5" fill="none" stroke="#2c313c"/><text x="1170" y="38" fill="#8892a0" font-size="11" text-anchor="middle">Sign out</text>

    <!-- ── Hero ────────────────────────────────────────────── -->
    <g transform="translate(720 300)">
      <rect x="-32" y="-40" width="64" height="64" rx="18" fill="url(#coral)"/>
      <rect x="-13" y="-21" width="26" height="26" rx="6" fill="#fff" opacity="0.9" transform="rotate(45 0 -8)"/>
      <text x="0" y="66" fill="#e8ecf1" font-size="26" font-weight="600" text-anchor="middle" font-family="Fira Code,Consolas,monospace">Private AI Workspace</text>
      <text x="0" y="96" fill="#ee6a5f" font-size="15" text-anchor="middle">Private by design — ready when you are.</text>
      <text x="0" y="126" fill="#8892a0" font-size="13.5" text-anchor="middle">Ask a question, upload a document, run an agent, or compare models —</text>
      <text x="0" y="146" fill="#8892a0" font-size="13.5" text-anchor="middle">everything stays inside your workspace.</text>
      <g font-size="12.5" text-anchor="middle">
        <rect x="-240" y="168" width="140" height="30" rx="15" fill="#191b21" stroke="#2c313c"/><text x="-170" y="188" fill="#e8ecf1">Upload a document</text>
        <rect x="-92" y="168" width="104" height="30" rx="15" fill="#191b21" stroke="#2c313c"/><text x="-40" y="188" fill="#e8ecf1">Run an agent</text>
        <rect x="20" y="168" width="120" height="30" rx="15" fill="#191b21" stroke="#2c313c"/><text x="80" y="188" fill="#e8ecf1">Compare models</text>
        <rect x="148" y="168" width="96" height="30" rx="15" fill="#191b21" stroke="#2c313c"/><text x="196" y="188" fill="#e8ecf1">Save a note</text>
      </g>
    </g>

    <!-- ── Composer ────────────────────────────────────────── -->
    <rect x="400" y="622" width="640" height="94" rx="18" fill="#15171c" stroke="#2c313c"/>
    <rect x="416" y="636" width="118" height="26" rx="13" fill="#22262e" stroke="#2c313c"/><text x="428" y="653" fill="#e8ecf1" font-size="12">MiniMax-M2  ⌄</text>
    <rect x="922" y="636" width="104" height="26" rx="13" fill="#22262e" stroke="#2c313c"/>
    <rect x="924" y="638" width="52" height="22" rx="11" fill="#ee6a5f"/><text x="950" y="653" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Chat</text>
    <text x="1001" y="653" fill="#8892a0" font-size="12" text-anchor="middle">Agent</text>
    <text x="424" y="686" fill="#5f6b7a" font-size="13">Message Private AI…</text>
    <rect x="998" y="676" width="30" height="30" rx="9" fill="#ee6a5f"/><text x="1013" y="696" fill="#fff" font-size="15" text-anchor="middle">↑</text>
  </g>
</svg>
