# Phase 1 - platform baseline AWS architecture (milestones M0-M8).
#
# Rendered with awslabs/diagram-as-code (awsdac): https://github.com/awslabs/diagram-as-code
# Regenerate with: scripts/generate-diagrams.sh
#
# Classic AWS reference style: an AWS Cloud frame containing the VPC with public
# and private subnets across two Availability Zones. The CPU control-plane node
# group is internet-reachable only through the ALB; the GPU inference node group
# (vLLM) stays private/internal-only. Regional managed services sit outside the VPC.
Diagram:
  DefinitionFiles:
    - Type: URL
      Url: "https://raw.githubusercontent.com/awslabs/diagram-as-code/main/definitions/definition-for-aws-icons-light.yaml"

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: horizontal
      Children:
        - User
        - AWSCloud

    User:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: "Users / API clients"

    AWSCloud:
      Type: AWS::Diagram::Cloud
      Direction: vertical
      Align: center
      Children:
        - EdgeIdentity
        - VPC
        - ManagedData
        - Observability

    # Regional edge and identity services
    EdgeIdentity:
      Type: AWS::Diagram::Resource
      Title: "Edge & identity"
      BorderColor: "rgba(120,120,120,255)"
      BorderType: Dashed
      Direction: horizontal
      Children:
        - Route53
        - ACM
        - Cognito
    Route53:
      Type: AWS::Route53::HostedZone
      Title: "Route 53"
    ACM:
      Type: AWS::CertificateManager
      Title: "ACM (TLS)"
    Cognito:
      Type: AWS::Cognito::UserPool
      Title: "OIDC issuer (Cognito)"

    # Network
    VPC:
      Type: AWS::EC2::VPC
      Direction: vertical
      Title: "VPC"
      Children:
        - EKS
        - PublicSubnets
        - PrivateSubnets
    EKS:
      Type: AWS::EKS
      Title: "Amazon EKS cluster"

    PublicSubnets:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - PublicSubnetA
        - PublicSubnetB
    PublicSubnetA:
      Type: AWS::EC2::Subnet
      Preset: PublicSubnet
      Title: "Public subnet (AZ-a)"
      Children:
        - ALB
    ALB:
      Type: AWS::ElasticLoadBalancingV2::LoadBalancer
      Title: "Application Load Balancer"
    PublicSubnetB:
      Type: AWS::EC2::Subnet
      Preset: PublicSubnet
      Title: "Public subnet (AZ-b)"
      Children:
        - NatGW
    NatGW:
      Type: AWS::EC2::NatGateway
      Title: "NAT gateway"

    PrivateSubnets:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - PrivateSubnetA
        - PrivateSubnetB
    PrivateSubnetA:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: "Private subnet (AZ-a)"
      Children:
        - ControlPlane
    ControlPlane:
      Type: AWS::Diagram::Resource
      Title: "Control-plane node group (CPU)"
      BorderColor: "rgba(52,168,83,255)"
      Children:
        - AppPod
    AppPod:
      Type: AWS::EC2::Instance
      Title: "control-plane API"
    PrivateSubnetB:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: "Private subnet (AZ-b)"
      Children:
        - InferencePlane
    InferencePlane:
      Type: AWS::Diagram::Resource
      Title: "Inference node group (GPU)"
      BorderColor: "rgba(217,48,37,255)"
      Children:
        - VllmPod
    VllmPod:
      Type: AWS::EC2::Instance
      Title: "vLLM (internal-only)"

    # Managed data & container registry
    ManagedData:
      Type: AWS::Diagram::Resource
      Title: "Managed data & registry"
      BorderColor: "rgba(120,120,120,255)"
      BorderType: Dashed
      Direction: horizontal
      Children:
        - RDS
        - S3
        - Secrets
        - ECR
    RDS:
      Type: AWS::RDS::DBInstance
      Title: "RDS PostgreSQL"
    S3:
      Type: AWS::S3::Bucket
      Title: "S3 (artifacts)"
    Secrets:
      Type: AWS::SecretsManager::Secret
      Title: "Secrets Manager"
    ECR:
      Type: AWS::ECR
      Title: "ECR (images)"

    # Observability
    Observability:
      Type: AWS::Diagram::Resource
      Title: "Observability"
      BorderColor: "rgba(120,120,120,255)"
      BorderType: Dashed
      Direction: horizontal
      Children:
        - AMP
        - AMG
        - Logs
    AMP:
      Type: AWS::APS::Workspace
      Title: "Managed Prometheus"
    AMG:
      Type: AWS::Grafana::Workspace
      Title: "Managed Grafana"
    Logs:
      Type: AWS::Logs
      Title: "CloudWatch logs"

  Links:
    - Source: User
      SourcePosition: E
      Target: ALB
      TargetPosition: N
      TargetArrowHead:
        Type: Open
    - Source: ALB
      SourcePosition: S
      Target: AppPod
      TargetPosition: N
      TargetArrowHead:
        Type: Open
    - Source: AppPod
      SourcePosition: E
      Target: VllmPod
      TargetPosition: W
      TargetArrowHead:
        Type: Open
    - Source: AppPod
      SourcePosition: S
      Target: RDS
      TargetPosition: N
      TargetArrowHead:
        Type: Open
    - Source: AppPod
      SourcePosition: S
      Target: S3
      TargetPosition: N
      TargetArrowHead:
        Type: Open
    - Source: AppPod
      SourcePosition: S
      Target: Secrets
      TargetPosition: N
      TargetArrowHead:
        Type: Open
    - Source: AppPod
      SourcePosition: N
      Target: Cognito
      TargetPosition: S
      TargetArrowHead:
        Type: Open
    - Source: ECR
      SourcePosition: N
      Target: AppPod
      TargetPosition: S
      TargetArrowHead:
        Type: Open
