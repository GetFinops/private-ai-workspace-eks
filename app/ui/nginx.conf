# nginx configuration for the Private AI Workspace UI container.
#
# Responsibilities:
#   - Serve the static SPA assets from /usr/share/nginx/html/static/
#   - Proxy /v1/, /auth/, /healthz, /readyz to the upstream control plane
#   - Enforce a strict Content Security Policy (M9 security checkpoint)
#   - Add CSRF-relevant security headers
#   - Render /config.json from environment variables at startup
#
# The startup script (docker-entrypoint.sh) writes /config.json before
# nginx starts, using values injected via Helm ConfigMap env vars.

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Upstream: control-plane service (Kubernetes service DNS)
    upstream control_plane {
        server ${CONTROL_PLANE_HOST}:${CONTROL_PLANE_PORT};
        keepalive 8;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── Security headers ─────────────────────────────────────────────────
        # Content Security Policy — no inline scripts; fonts, images self-only.
        # 'unsafe-inline' is absent for script-src: all JS is in external files
        # under /static/ (app.js for the app shell, login.js for the login page);
        # no page may use an inline <script>.  connect-src includes the OIDC issuer so
        # the SPA's PKCE token exchange can reach the provider's /token endpoint
        # cross-origin without violating CSP.  CONTROL_PLANE_HOST stays internal
        # and is reached via same-origin proxy (covered by 'self').
        #
        # CONNECT_SRC_OIDC is substituted by docker-entrypoint.sh from the
        # configured issuer host(s).  Empty default keeps the policy strict
        # when no issuer is configured (e.g. fresh dev install).
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' ${CONNECT_SRC_OIDC}; frame-ancestors 'none'; form-action 'self' ${CONNECT_SRC_OIDC};"
            always;
        add_header X-Content-Type-Options  "nosniff"  always;
        add_header X-Frame-Options         "DENY"      always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "geolocation=(), camera=(), microphone=()" always;

        # HSTS — only set when TLS is terminated upstream (ALB/ingress).
        # Injected by the Helm chart's ingress annotation; not set here to
        # avoid breaking non-TLS dev setups.

        # ── Static assets ────────────────────────────────────────────────────
        # The SPA assets are unversioned (no content hash in the filename), so
        # they must NOT be cached immutably — otherwise a deploy's new app.js /
        # login.js never reaches browsers that cached the old one (this caused a
        # stale token-handling bug). `no-cache` keeps the asset cached but forces
        # an ETag revalidation each load: nginx returns 304 when unchanged
        # (cheap) and the new file the moment it changes.
        location /static/ {
            add_header Cache-Control "no-cache" always;
            # Security headers must be re-added under location blocks.
            add_header Content-Security-Policy
                "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' ${CONNECT_SRC_OIDC}; frame-ancestors 'none'; form-action 'self' ${CONNECT_SRC_OIDC};"
                always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }

        # ── Runtime config (short cache; values from Helm) ───────────────────
        location = /config.json {
            expires 5m;
            add_header Cache-Control "public, max-age=300";
            add_header Content-Security-Policy
                "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' ${CONNECT_SRC_OIDC}; frame-ancestors 'none'; form-action 'self' ${CONNECT_SRC_OIDC};"
                always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ── API proxy → control plane ────────────────────────────────────────
        location ~ ^/(v1|auth|healthz|readyz)(/|$) {
            proxy_pass         http://control_plane;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
            # Strip the UI CSP from proxied API responses.
            proxy_hide_header  Content-Security-Policy;
        }

        # ── SPA fallback ─────────────────────────────────────────────────────
        location = /login.html { try_files $uri =404; }
        location = /callback   { try_files /index.html =404; }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
