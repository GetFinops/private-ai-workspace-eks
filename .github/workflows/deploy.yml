name: Deploy

on:
  # push trigger re-enabled once GitHub Actions vars/secrets are configured
  # (AWS_DEPLOY_ROLE_ARN, ECR_CONTROL_PLANE_URL, EKS_CLUSTER_NAME, etc.).
  # See deploy/values/dev/app.yaml and docs/milestones/m2-eks-baseline-deployment.md.
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
      deploy_inference:
        description: "Deploy vLLM inference chart (requires GPU nodes and HF token configured)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      deploy_observability:
        description: "Deploy observability stack (kube-prometheus-stack + dashboards)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Prevent concurrent deploys to the same environment.
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  # ── Build and push the control-plane image ──────────────────────────────────
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC credential exchange with AWS
      contents: read

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.ECR_CONTROL_PLANE_URL }}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ vars.ECR_CONTROL_PLANE_URL }}:latest

  # ── Deploy to target environment via Helm ───────────────────────────────────
  deploy:
    name: Helm deploy (${{ github.event.inputs.environment || 'dev' }})
    needs: build-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read

    env:
      ENV: ${{ github.event.inputs.environment || 'dev' }}
      IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.17.x"

      - name: Deploy cluster add-ons (ExternalSecrets Operator)
        run: |
          helm dependency update deploy/helm/cluster-addons
          helm upgrade --install cluster-addons deploy/helm/cluster-addons \
            --namespace kube-system \
            --create-namespace \
            --wait \
            --timeout 5m

      - name: Deploy control-plane chart
        run: |
          helm upgrade --install private-ai-workspace deploy/helm/private-ai-workspace \
            --namespace app \
            --create-namespace \
            --set image.repository="${{ vars.ECR_CONTROL_PLANE_URL }}" \
            --set image.tag="${IMAGE_TAG}" \
            --set serviceAccount.irsaRoleArn="${{ vars.IRSA_APP_ROLE_ARN }}" \
            --set externalSecrets.secretsManagerSecretName="${{ vars.APP_CONFIG_SECRET_NAME }}" \
            --set externalSecrets.awsRegion="${{ vars.AWS_REGION }}" \
            -f "deploy/values/${ENV}/app.yaml" \
            --wait \
            --timeout 5m

      - name: Deploy vLLM inference chart (opt-in)
        if: ${{ github.event.inputs.deploy_inference == 'true' }}
        run: |
          helm upgrade --install vllm deploy/helm/vllm \
            --namespace inference \
            --create-namespace \
            --set serviceAccount.irsaRoleArn="${{ vars.IRSA_VLLM_ROLE_ARN }}" \
            --set externalSecrets.awsRegion="${{ vars.AWS_REGION }}" \
            --set externalSecrets.hfTokenSecretName="${{ vars.HF_TOKEN_SECRET_NAME }}" \
            -f "deploy/values/${ENV}/vllm.yaml" \
            --wait \
            --timeout 15m

      - name: Deploy observability stack (opt-in)
        if: ${{ github.event.inputs.deploy_observability == 'true' }}
        run: |
          helm dependency update deploy/helm/observability
          helm upgrade --install observability deploy/helm/observability \
            --namespace monitoring \
            --create-namespace \
            -f "deploy/values/${ENV}/observability.yaml" \
            --wait \
            --timeout 10m

      - name: Verify health
        run: |
          kubectl wait deployment/private-ai-workspace-private-ai-workspace \
            --namespace app \
            --for=condition=Available \
            --timeout=120s
          kubectl get ingress --namespace app

      - name: Verify inference health (opt-in)
        if: ${{ github.event.inputs.deploy_inference == 'true' }}
        run: |
          kubectl wait deployment/vllm-vllm-inference \
            --namespace inference \
            --for=condition=Available \
            --timeout=600s
          kubectl get pods --namespace inference

      - name: Verify observability health (opt-in)
        if: ${{ github.event.inputs.deploy_observability == 'true' }}
        run: |
          kubectl wait deployment/observability-grafana \
            --namespace monitoring \
            --for=condition=Available \
            --timeout=120s
          kubectl get pods --namespace monitoring
