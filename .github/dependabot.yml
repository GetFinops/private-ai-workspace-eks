# Dependabot version updates.
# Security updates (from GitHub Advisory) are enabled separately in repo settings;
# this file governs scheduled VERSION updates for each ecosystem present in the
# repo. Grouped to keep PR volume low; DCO sign-off on Dependabot PRs is handled
# by maintainer review at merge (see CONTRIBUTING.md / m7a-report F-05).
version: 2
updates:
  # GitHub Actions used by CI / deploy / CodeQL workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  # Python runtime dependencies declared in pyproject.toml (psycopg, boto3,
  # PyJWT, cryptography, prometheus-client, opentelemetry, ...).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps(python)"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # Control-plane container base image.
  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps(docker)"

  # UI (nginx) container base image.
  - package-ecosystem: "docker"
    directory: "/app/ui"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps(docker)"

  # Terraform providers / modules for the AWS/EKS baseline.
  - package-ecosystem: "terraform"
    directory: "/infra/terraform"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "terraform"]
    commit-message:
      prefix: "deps(terraform)"
    groups:
      terraform:
        patterns: ["*"]
