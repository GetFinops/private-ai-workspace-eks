# Observability stack values for private-ai-workspace.
#
# Based on kube-prometheus-stack with extensions for:
#   - vLLM Prometheus metrics scraping (/metrics on port 8000)
#   - NVIDIA DCGM GPU metrics
#   - Structured alert rules for inference latency and queue depth
#
# Reference architecture: docs/07-observability.md

kubePrometheusStack:
  enabled: true

  prometheus:
    prometheusSpec:
      # Scrape all PodMonitor and ServiceMonitor resources cluster-wide.
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false

      retention: 15d
      retentionSize: "10GB"

      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi

      additionalScrapeConfigs:
        # vLLM metrics — scraped from inference pods via pod annotation.
        - job_name: vllm-inference
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: "true"
            - source_labels: [__meta_kubernetes_pod_label_private_ai_workspace_plane]
              action: keep
              regex: inference
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: (.+):(?:\d+);(\d+)
              replacement: $1:$2
              target_label: __address__
            - source_labels: [__meta_kubernetes_namespace]
              target_label: kubernetes_namespace
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: kubernetes_pod_name

        # NVIDIA DCGM exporter — installed via nvidia-device-plugin or dcgm-exporter.
        - job_name: dcgm-exporter
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              action: keep
              regex: dcgm-exporter

  grafana:
    enabled: true
    adminPassword: ""  # Set via Secrets Manager / ExternalSecrets in production.

    grafana.ini:
      server:
        root_url: ""  # Set to your public Grafana URL.
      security:
        disable_initial_admin_creation: false

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            url: http://{{ .Release.Name }}-kube-prometheus-stack-prometheus:9090
            isDefault: true

    # Sidecar auto-discovers ConfigMaps labelled grafana_dashboard="1" across
    # all namespaces — the same pattern used by the upstream AWS sample repo.
    # Dashboard ConfigMaps are shipped as Helm templates in this chart.
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: false

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  alertmanager:
    enabled: true

  # Alert rules for the inference plane.
  # Extend with additional rules as the system matures (M5/M6).
  additionalPrometheusRulesMap:
    inference-alerts:
      groups:
        - name: inference.rules
          rules:
            - alert: InferenceQueueDepthHigh
              expr: vllm_num_requests_waiting > 20
              for: 2m
              labels:
                severity: warning
              annotations:
                summary: "vLLM request queue is backing up"
                description: "vLLM has {{ $value }} waiting requests for 2+ minutes."

            - alert: InferenceReplicaUnavailable
              expr: kube_deployment_status_replicas_available{deployment=~".*vllm.*"} == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "No vLLM inference replicas available"
                description: "The inference deployment has had 0 ready replicas for 5 minutes."

    control-plane-alerts:
      groups:
        - name: control-plane.rules
          rules:
            - alert: ControlPlaneNotReady
              expr: up{job="private-ai-workspace-control-plane"} == 0
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "Control plane is down"
                description: "The control-plane service has been unreachable for 1 minute."
