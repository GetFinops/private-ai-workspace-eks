apiVersion: v2
name: observability
description: >
  Umbrella chart for the observability stack of private-ai-workspace (M5 milestone).
  Installs kube-prometheus-stack (Prometheus + Grafana + Alertmanager) and
  provides pre-configured values for vLLM and DCGM GPU metrics scraping.
type: application
version: 0.1.0
dependencies:
  - name: kube-prometheus-stack
    version: "72.x.x"
    repository: "https://prometheus-community.github.io/helm-charts"
    # Subchart values must be nested under the subchart's real name
    # (`kube-prometheus-stack`). They were previously under `kubePrometheusStack`,
    # which the subchart ignored — so every override was silently dropped and it
    # ran on its (heavy) defaults. (No alias: a camelCase alias would also break
    # resource names, which must be lowercase RFC 1123.)
    condition: kube-prometheus-stack.enabled
