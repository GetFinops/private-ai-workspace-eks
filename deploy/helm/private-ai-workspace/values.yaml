replicaCount: 1

image:
  repository: private-ai-workspace-control-plane
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

config:
  environment: production
  logLevel: INFO
  objectStorageBucket: ""
  inferenceBaseUrl: http://vllm.inference.svc.cluster.local:8000
  secretsProvider: aws-secrets-manager

externalSecrets:
  # Secret must contain DATABASE_URL, AUTH_ISSUER_URL, AUTH_AUDIENCE, and AUTH_ADMIN_GROUP.
  existingSecret: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
