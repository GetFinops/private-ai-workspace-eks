replicaCount: 1

image:
  repository: private-ai-workspace-control-plane
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  # Set from Terraform output: $(terraform -chdir=infra/terraform output -raw irsa_app_role_arn)
  irsaRoleArn: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  # IngressClass (replaces the deprecated kubernetes.io/ingress.class annotation).
  className: alb
  # Set to your public hostname (e.g. api.yourdomain.com).
  host: ""
  # ACM certificate ARN for HTTPS. Required when ingress.enabled=true.
  certificateArn: ""
  annotations: {}

config:
  environment: production
  logLevel: INFO
  logFormat: json
  objectStorageBucket: ""
  inferenceBaseUrl: http://vllm-inference.inference.svc.cluster.local:8000
  secretsProvider: aws-secrets-manager
  # M10 retrieval embeddings. Point at an in-cluster OpenAI-compatible
  # /v1/embeddings service (e.g. the deploy/helm/embedding chart). Leave empty
  # to use the deterministic dev embedding instead of a real model.
  embeddingBaseUrl: ""
  embeddingModel: ""
  # OTEL gRPC collector endpoint.  Leave empty for no-op tracing.
  otelEndpoint: ""
  # M11 agent tool framework. Disabled by default (operator kill-switch).
  # When enabled, tools run out-of-process in a scrubbed/rlimited sandbox and
  # are deny-by-default: only tenants in the allow-list may invoke a tool.
  # agentToolsAllowlist is a JSON string: {"<tenant>": ["tool", ...]}.
  agentToolsEnabled: false
  agentToolsAllowlist: ""
  agentToolsRatePerMinute: 30
  agentToolsMaxConcurrency: 4
  # M11 agent loop (plan→act→observe). Shares the kill-switch + allow-list;
  # runs require INFERENCE_BASE_URL reachable (else refused cleanly). Budgets
  # are server-enforced. agentLoopModel is the served model name to target;
  # leave empty to use the control-plane default until vLLM is deployed.
  agentLoopMaxSteps: 6
  agentLoopWallClockSeconds: 60
  agentLoopMaxTokens: 512
  agentLoopModel: ""
  # M11 Job-sandbox: where to reach the tool-runner dispatcher, and the name of
  # the in-namespace Secret holding the shared DISPATCHER_TOKEN. Leave empty to
  # disable job-backed tools (subprocess tools are unaffected).
  agentToolsDispatcherUrl: ""
  agentToolsDispatcherTokenSecret: ""
  # M12 MCP integration. Disabled by default (operator kill-switch). MCP servers
  # run in the M11 sandbox; deny-by-default per-tenant allow-list (JSON string
  # {"<tenant>": ["<server>", ...]}).
  mcpEnabled: false
  mcpAllowlist: ""
  # M13 personal-information integrations. Disabled by default (operator
  # kill-switch). Deny-by-default per-tenant allow-list (JSON string
  # {"<tenant>": ["<integration>", ...]}). Credentials are resolved per tenant
  # from Secrets Manager via IRSA; all egress routes through the hardened URL
  # guard. The fixture token credential is NOT set here (dev fixture uses
  # INTEGRATIONS_FIXTURE_TOKEN supplied out-of-band in development only).
  integrationsEnabled: false
  integrationsAllowlist: ""
  integrationsRatePerMinute: 30
  integrationsMaxConcurrency: 4
  integrationsOutboundTimeoutS: 10
  # M14 media services. Disabled by default (operator kill-switch). Deny-by-default
  # per-tenant allow-list (JSON {"<tenant>": ["<service>"]}). MEDIA_SERVICES is JSON
  # {"<name>": {"kind": "stt"|"image", "base_url": "..."}} pointing at the isolated
  # GPU backends. Server-side rate + size caps.
  mediaEnabled: false
  mediaAllowlist: ""
  mediaServices: ""
  mediaRatePerMinute: 10
  mediaMaxConcurrency: 2
  mediaMaxAudioBytes: "26214400"   # 25 MiB (string to avoid helm float coercion)
  mediaMaxPromptChars: 2000

# M13 dev-only synthetic loopback fixture. A fake in-cluster calendar provider
# used to validate the integration harness end-to-end without a real third
# party. NEVER enable outside development.
integrationsFixture:
  enabled: false
  image: ""        # defaults to the control-plane image (same code, fixture entrypoint)
  port: 8099
  token: "fixture-token"   # dev fixture bearer; not a real credential

externalSecrets:
  enabled: false
  # AWS region where Secrets Manager secrets live.
  awsRegion: us-east-1
  # Secrets Manager secret name holding DATABASE_URL, AUTH_ISSUER_URL,
  # AUTH_AUDIENCE, AUTH_ADMIN_GROUP as JSON keys.
  # Set from Terraform output: $(terraform -chdir=infra/terraform output -raw app_config_secret_name)
  secretsManagerSecretName: ""
  # Name of the Kubernetes Secret created by ExternalSecrets.
  # Must match the deployment's envFrom.secretRef reference.
  existingSecret: ""
  refreshInterval: "1h"

# Control-plane egress NetworkPolicy (defense-in-depth behind the M13 URL guard).
# Requires the cluster to ENFORCE NetworkPolicy (EKS VPC CNI enableNetworkPolicy,
# Calico, or Cilium) — otherwise this renders but is a no-op. Disabled by default;
# enable per-environment once the VPC/DB CIDRs below are set correctly.
networkPolicy:
  enabled: false
  # VPC CIDR excluded from the internet allow rule (blocks lateral movement).
  vpcCidr: "10.0.0.0/16"
  # Namespaces hosting in-cluster services the control plane calls.
  inferenceNamespace: inference
  jobsNamespace: agent-jobs
  # Explicit in-VPC egress allow-list (the database). Scope tightly — e.g. the
  # RDS instance IP /32. Everything else in the VPC is denied.
  dbEgressCidrs: []
  dbPort: 5432

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Prometheus metrics (M5).
# Enables /metrics endpoint annotations and optionally creates a ServiceMonitor.
metrics:
  enabled: true
  port: "8080"
  path: /metrics
  serviceMonitor:
    enabled: false        # Enable when kube-prometheus-stack is installed.
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}  # Add e.g. release: prometheus to match your Prometheus selector.

# Route control-plane pods to the CPU node group; GPU nodes are tainted.
nodeSelector:
  private-ai-workspace/plane: control

tolerations: []
affinity: {}
