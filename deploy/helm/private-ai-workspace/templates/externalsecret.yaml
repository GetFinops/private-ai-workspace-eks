{{- if .Values.externalSecrets.enabled }}
# ExternalSecret syncs application config from AWS Secrets Manager into
# a Kubernetes Secret.  The Deployment references this Secret via envFrom.
# The Secrets Manager secret must be a JSON object containing:
#   DATABASE_URL, AUTH_ISSUER_URL, AUTH_AUDIENCE, AUTH_ADMIN_GROUP
# Values are set by operators; see infra/terraform output app_config_secret_name.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "private-ai-workspace.fullname" . }}-app-config
  labels:
    app.kubernetes.io/name: {{ include "private-ai-workspace.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ include "private-ai-workspace.fullname" . }}-aws
    kind: SecretStore
  target:
    name: {{ .Values.externalSecrets.existingSecret | default (printf "%s-app-secrets" (include "private-ai-workspace.fullname" .)) }}
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.secretsManagerSecretName | quote }}
        property: DATABASE_URL
    - secretKey: AUTH_ISSUER_URL
      remoteRef:
        key: {{ .Values.externalSecrets.secretsManagerSecretName | quote }}
        property: AUTH_ISSUER_URL
    - secretKey: AUTH_AUDIENCE
      remoteRef:
        key: {{ .Values.externalSecrets.secretsManagerSecretName | quote }}
        property: AUTH_AUDIENCE
    - secretKey: AUTH_ADMIN_GROUP
      remoteRef:
        key: {{ .Values.externalSecrets.secretsManagerSecretName | quote }}
        property: AUTH_ADMIN_GROUP
{{- end }}
