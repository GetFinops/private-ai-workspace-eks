apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "private-ai-workspace.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "private-ai-workspace.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "private-ai-workspace.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "private-ai-workspace.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- if .Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | default "8080" | quote }}
        prometheus.io/path: {{ .Values.metrics.path | default "/metrics" | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "private-ai-workspace.serviceAccountName" . }}
      {{- if .Values.metrics.enabled }}
      # Prometheus pod annotations for scrape discovery (annotation-based scrape).
      # The ServiceMonitor below is the preferred path; these annotations are a
      # belt-and-suspenders fallback for clusters without the Prometheus Operator.
      {{- end }}
      containers:
        - name: control-plane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "private-ai-workspace.fullname" . }}-config
            {{- if .Values.externalSecrets.existingSecret }}
            - secretRef:
                name: {{ .Values.externalSecrets.existingSecret }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
