apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "private-ai-workspace.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "private-ai-workspace.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | default "json" | quote }}
  OBJECT_STORAGE_BUCKET: {{ .Values.config.objectStorageBucket | quote }}
  INFERENCE_BASE_URL: {{ .Values.config.inferenceBaseUrl | quote }}
  SECRETS_PROVIDER: {{ .Values.config.secretsProvider | quote }}
  {{- if .Values.config.embeddingBaseUrl }}
  EMBEDDING_BASE_URL: {{ .Values.config.embeddingBaseUrl | quote }}
  EMBEDDING_MODEL: {{ .Values.config.embeddingModel | default "embedding" | quote }}
  {{- end }}
  {{- if .Values.config.otelEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  {{- end }}
  {{- if .Values.config.agentToolsEnabled }}
  AGENT_TOOLS_ENABLED: "true"
  {{- if .Values.config.agentToolsAllowlist }}
  AGENT_TOOLS_ALLOWLIST: {{ .Values.config.agentToolsAllowlist | quote }}
  {{- end }}
  AGENT_TOOLS_RATE_PER_MINUTE: {{ .Values.config.agentToolsRatePerMinute | default 30 | quote }}
  AGENT_TOOLS_MAX_CONCURRENCY: {{ .Values.config.agentToolsMaxConcurrency | default 4 | quote }}
  # Agent loop (M11 follow-up) — shares the kill-switch above; runs need
  # INFERENCE_BASE_URL reachable. Budgets are server-enforced.
  AGENT_LOOP_MAX_STEPS: {{ .Values.config.agentLoopMaxSteps | default 6 | quote }}
  AGENT_LOOP_WALL_CLOCK_SECONDS: {{ .Values.config.agentLoopWallClockSeconds | default 60 | quote }}
  AGENT_LOOP_MAX_TOKENS: {{ .Values.config.agentLoopMaxTokens | default 512 | quote }}
  {{- if .Values.config.agentLoopModel }}
  AGENT_LOOP_MODEL: {{ .Values.config.agentLoopModel | quote }}
  {{- end }}
  {{- if .Values.config.agentToolsDispatcherUrl }}
  AGENT_TOOLS_DISPATCHER_URL: {{ .Values.config.agentToolsDispatcherUrl | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.config.mcpEnabled }}
  MCP_ENABLED: "true"
  {{- if .Values.config.mcpAllowlist }}
  MCP_ALLOWLIST: {{ .Values.config.mcpAllowlist | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.config.integrationsEnabled }}
  # M13 personal-information integrations. Deny-by-default; credentials resolved
  # per tenant from Secrets Manager via IRSA; all egress through the URL guard.
  INTEGRATIONS_ENABLED: "true"
  {{- if .Values.config.integrationsAllowlist }}
  INTEGRATIONS_ALLOWLIST: {{ .Values.config.integrationsAllowlist | quote }}
  {{- end }}
  INTEGRATIONS_RATE_PER_MINUTE: {{ .Values.config.integrationsRatePerMinute | default 30 | quote }}
  INTEGRATIONS_MAX_CONCURRENCY: {{ .Values.config.integrationsMaxConcurrency | default 4 | quote }}
  INTEGRATIONS_OUTBOUND_TIMEOUT_S: {{ .Values.config.integrationsOutboundTimeoutS | default 10 | quote }}
  {{- if .Values.config.integrationsSecretEnv }}
  # Aligns the integration secret-id prefix with the Terraform/IRSA env token.
  INTEGRATIONS_SECRET_ENV: {{ .Values.config.integrationsSecretEnv | quote }}
  {{- end }}
  {{- if .Values.config.integrationsSecretTtlS }}
  INTEGRATIONS_SECRET_TTL_S: {{ .Values.config.integrationsSecretTtlS | quote }}
  {{- end }}
  {{- if .Values.integrationsFixture.enabled }}
  # Dev-only synthetic fixture (never enable outside dev).
  INTEGRATIONS_FIXTURE_URL: {{ printf "http://%s-loopback-fixture:%v" (include "private-ai-workspace.fullname" .) .Values.integrationsFixture.port | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.config.mediaEnabled }}
  # M14 media services. Deny-by-default per-tenant; the control plane routes to
  # isolated GPU backends (MEDIA_SERVICES). Server-side rate + size caps.
  MEDIA_ENABLED: "true"
  {{- if .Values.config.mediaAllowlist }}
  MEDIA_ALLOWLIST: {{ .Values.config.mediaAllowlist | quote }}
  {{- end }}
  {{- if .Values.config.mediaServices }}
  MEDIA_SERVICES: {{ .Values.config.mediaServices | quote }}
  {{- end }}
  MEDIA_RATE_PER_MINUTE: {{ .Values.config.mediaRatePerMinute | default 10 | quote }}
  MEDIA_MAX_CONCURRENCY: {{ .Values.config.mediaMaxConcurrency | default 2 | quote }}
  MEDIA_MAX_AUDIO_BYTES: {{ .Values.config.mediaMaxAudioBytes | default "26214400" | quote }}
  MEDIA_MAX_PROMPT_CHARS: {{ .Values.config.mediaMaxPromptChars | default 2000 | quote }}
  {{- end }}
  {{- if .Values.config.modelInstallEnabled }}
  # Model management Phase 1a: record self-serve install REQUESTS only (no cluster
  # mutation, no HF token). Deny-by-default: kill-switch + HF repo/org allow-list.
  MODEL_INSTALL_ENABLED: "true"
  {{- if .Values.config.modelInstallAllowlist }}
  MODEL_INSTALL_ALLOWLIST: {{ .Values.config.modelInstallAllowlist | quote }}
  {{- end }}
  MODEL_INSTALL_MAX_OPEN_PER_TENANT: {{ .Values.config.modelInstallMaxOpenPerTenant | default 25 | quote }}
  {{- if .Values.config.modelInstallAllowAllUsers }}
  MODEL_INSTALL_ALLOW_ALL_USERS: "true"
  {{- end }}
  {{- if .Values.config.modelInstallGroup }}
  MODEL_INSTALL_GROUP: {{ .Values.config.modelInstallGroup | quote }}
  {{- end }}
  {{- end }}
