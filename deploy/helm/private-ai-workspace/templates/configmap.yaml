apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "private-ai-workspace.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "private-ai-workspace.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | default "json" | quote }}
  OBJECT_STORAGE_BUCKET: {{ .Values.config.objectStorageBucket | quote }}
  INFERENCE_BASE_URL: {{ .Values.config.inferenceBaseUrl | quote }}
  SECRETS_PROVIDER: {{ .Values.config.secretsProvider | quote }}
  {{- if .Values.config.embeddingBaseUrl }}
  EMBEDDING_BASE_URL: {{ .Values.config.embeddingBaseUrl | quote }}
  EMBEDDING_MODEL: {{ .Values.config.embeddingModel | default "embedding" | quote }}
  {{- end }}
  {{- if .Values.config.otelEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  {{- end }}
  {{- if .Values.config.agentToolsEnabled }}
  AGENT_TOOLS_ENABLED: "true"
  {{- if .Values.config.agentToolsAllowlist }}
  AGENT_TOOLS_ALLOWLIST: {{ .Values.config.agentToolsAllowlist | quote }}
  {{- end }}
  AGENT_TOOLS_RATE_PER_MINUTE: {{ .Values.config.agentToolsRatePerMinute | default 30 | quote }}
  AGENT_TOOLS_MAX_CONCURRENCY: {{ .Values.config.agentToolsMaxConcurrency | default 4 | quote }}
  # Agent loop (M11 follow-up) — shares the kill-switch above; runs need
  # INFERENCE_BASE_URL reachable. Budgets are server-enforced.
  AGENT_LOOP_MAX_STEPS: {{ .Values.config.agentLoopMaxSteps | default 6 | quote }}
  AGENT_LOOP_WALL_CLOCK_SECONDS: {{ .Values.config.agentLoopWallClockSeconds | default 60 | quote }}
  AGENT_LOOP_MAX_TOKENS: {{ .Values.config.agentLoopMaxTokens | default 512 | quote }}
  {{- if .Values.config.agentLoopModel }}
  AGENT_LOOP_MODEL: {{ .Values.config.agentLoopModel | quote }}
  {{- end }}
  {{- if .Values.config.agentToolsDispatcherUrl }}
  AGENT_TOOLS_DISPATCHER_URL: {{ .Values.config.agentToolsDispatcherUrl | quote }}
  {{- end }}
  {{- end }}
