{{- if .Values.externalSecrets.enabled }}
# SecretStore (namespace-scoped) connecting External Secrets Operator to
# AWS Secrets Manager using the pod's IRSA service account token.
# The ESO controller uses the service account JWT to authenticate to AWS —
# no static credentials are used.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "private-ai-workspace.fullname" . }}-aws
  labels:
    app.kubernetes.io/name: {{ include "private-ai-workspace.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.awsRegion | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "private-ai-workspace.serviceAccountName" . }}
{{- end }}
