# Cluster add-ons values.
# Install with:
#   helm dependency update deploy/helm/cluster-addons
#   helm upgrade --install cluster-addons deploy/helm/cluster-addons \
#     --namespace kube-system --create-namespace

externalSecrets:
  enabled: true

nvidiaDevicePlugin:
  enabled: true

dcgmExporter:
  enabled: true

# External Secrets Operator values.
# Full reference: https://external-secrets.io/latest/introduction/getting-started/
external-secrets:
  installCRDs: true

  # The operator does not need direct AWS credentials itself.
  # Each SecretStore uses the pod's IRSA service-account JWT to authenticate.
  serviceAccount:
    create: true
    name: external-secrets

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  webhook:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

  certController:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

# DCGM Exporter — GPU metrics DaemonSet on GPU nodes.
# Exposes DCGM_FI_* Prometheus metrics scraped by the observability chart.
# Reference: https://github.com/NVIDIA/dcgm-exporter (Apache-2.0)
dcgm-exporter:
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  nodeSelector:
    private-ai-workspace/plane: inference
  serviceMonitor:
    enabled: false   # Enable when kube-prometheus-stack is installed.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# NVIDIA device plugin — advertises nvidia.com/gpu resources on GPU nodes.
# Runs as a DaemonSet with a toleration for the nvidia.com/gpu:NoSchedule taint
# so it lands on inference nodes and makes GPUs visible to the scheduler.
# Full reference: https://github.com/NVIDIA/k8s-device-plugin
nvidia-device-plugin:
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
