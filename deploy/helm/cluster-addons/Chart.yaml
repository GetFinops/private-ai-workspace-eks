apiVersion: v2
name: cluster-addons
description: >
  Umbrella chart for cluster-level add-ons required before application charts
  are deployed. Installs External Secrets Operator (ESO) so ExternalSecret
  resources in the control-plane chart can sync secrets from AWS Secrets Manager.
type: application
version: 0.1.0
dependencies:
  - name: external-secrets
    version: "0.x.x"
    repository: "https://charts.external-secrets.io"
    condition: externalSecrets.enabled
