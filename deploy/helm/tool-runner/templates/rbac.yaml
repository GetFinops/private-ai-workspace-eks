# The dispatcher is the ONLY identity with Job-create. Scoped to the jobs
# namespace and to exactly the verbs/resources the tool-runner needs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tool-runner-dispatcher
  namespace: {{ .Values.jobsNamespace }}
automountServiceAccountToken: true   # the dispatcher calls the API server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tool-runner-dispatcher
  namespace: {{ .Values.jobsNamespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tool-runner-dispatcher
  namespace: {{ .Values.jobsNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tool-runner-dispatcher
subjects:
  - kind: ServiceAccount
    name: tool-runner-dispatcher
    namespace: {{ .Values.jobsNamespace }}
---
# The runner Job's identity: unprivileged, NO IRSA, token never mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.runner.serviceAccountName }}
  namespace: {{ .Values.jobsNamespace }}
automountServiceAccountToken: false
