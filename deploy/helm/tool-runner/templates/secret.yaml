{{- if .Values.sharedToken }}
# Shared bearer token the control plane presents to the dispatcher. The same
# value is set as AGENT_TOOLS_DISPATCHER_TOKEN on the control plane.
apiVersion: v1
kind: Secret
metadata:
  name: tool-runner-dispatcher-token
  namespace: {{ .Values.jobsNamespace }}
type: Opaque
stringData:
  DISPATCHER_TOKEN: {{ .Values.sharedToken | quote }}
{{- end }}
