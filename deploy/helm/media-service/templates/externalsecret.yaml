{{- if .Values.externalSecrets.enabled }}
# Gated-model HF token via External Secrets Operator (IRSA). Off for ungated
# models. Mirrors the vLLM chart's externalsecret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "media-service.fullname" . }}-hf-token
  labels:
    {{- include "media-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "media-service.fullname" . }}-aws
    kind: SecretStore
  target:
    name: {{ include "media-service.fullname" . }}-hf-token
    creationPolicy: Owner
  data:
    - secretKey: HUGGING_FACE_HUB_TOKEN
      remoteRef:
        key: {{ .Values.externalSecrets.hfTokenSecretName | quote }}
        property: HUGGING_FACE_HUB_TOKEN
{{- end }}
