{{- if .Values.networkPolicy.enabled }}
# Ingress ONLY from the control-plane namespace (the sole caller). Egress is left
# open so the pod can pull model weights at startup. Mirrors the vLLM chart.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "media-service.fullname" . }}
  labels:
    {{- include "media-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "media-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.controlPlaneNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
