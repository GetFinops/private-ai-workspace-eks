{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vllm-inference.serviceAccountName" . }}
  labels:
    {{- include "vllm-inference.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.serviceAccount.irsaRoleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.irsaRoleArn | quote }}
    {{- end }}
{{- end }}
