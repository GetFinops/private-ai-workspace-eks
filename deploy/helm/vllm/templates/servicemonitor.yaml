{{- if .Values.metrics.serviceMonitor.enabled }}
# ServiceMonitor — tells the Prometheus Operator to scrape vLLM's /metrics
# endpoint (which exposes vllm_num_requests_waiting and many other counters).
# prometheus-adapter reads from this Prometheus and exposes the metric to the
# Kubernetes custom-metrics API, which the HPA in hpa.yaml targets.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "vllm-inference.fullname" . }}
  labels:
    {{- include "vllm-inference.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "vllm-inference.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout | default "10s" }}
{{- end }}
