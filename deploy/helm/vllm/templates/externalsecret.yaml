{{- if .Values.externalSecrets.enabled }}
# SecretStore (namespace-scoped) — connects External Secrets Operator to
# AWS Secrets Manager using the vLLM pod's IRSA service account token.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "vllm-inference.fullname" . }}-aws
  labels:
    {{- include "vllm-inference.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.awsRegion | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "vllm-inference.serviceAccountName" . }}
---
# ExternalSecret — pulls the Hugging Face Hub token from Secrets Manager
# and creates a Kubernetes Secret the Deployment references via envFrom.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "vllm-inference.fullname" . }}-hf-token
  labels:
    {{- include "vllm-inference.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "12h" }}
  secretStoreRef:
    name: {{ include "vllm-inference.fullname" . }}-aws
    kind: SecretStore
  target:
    name: {{ include "vllm-inference.fullname" . }}-hf-token
    creationPolicy: Owner
  data:
    - secretKey: HUGGING_FACE_HUB_TOKEN
      remoteRef:
        key: {{ .Values.externalSecrets.hfTokenSecretName | quote }}
        property: token
{{- end }}
