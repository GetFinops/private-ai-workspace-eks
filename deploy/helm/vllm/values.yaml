# vLLM inference chart values.
#
# Override with an environment-specific values file:
#   helm upgrade --install vllm deploy/helm/vllm -f deploy/values/dev/vllm.yaml
#
# The service type is deliberately ClusterIP so the inference endpoint is
# only reachable within the cluster. The control plane reaches it via the
# internal DNS name: http://vllm-inference.<namespace>.svc.cluster.local:8000

replicaCount: 1

image:
  repository: vllm/vllm-openai
  tag: "v0.9.0"
  pullPolicy: IfNotPresent

model:
  # Hugging Face model ID or local model path mounted from a PVC.
  # Required — override in your environment values file.
  id: ""
  # Optional dtype override (auto | float16 | bfloat16).
  dtype: "auto"
  # Maximum sequence length. Adjust to fit GPU VRAM.
  maxModelLen: 4096
  # Tensor parallelism degree (number of GPUs per replica).
  tensorParallelSize: 1
  # Maximum concurrent requests in the continuous batching queue.
  maxNumSeqs: 128
  # Optional stable alias to serve the model under (vLLM --served-model-name).
  # Decouples the control-plane model id (e.g. "default") from the HF model id.
  servedModelName: ""

# Extra raw args appended to the vLLM server command, e.g.
# ["--gpu-memory-utilization", "0.9"].
extraArgs: []

service:
  type: ClusterIP
  port: 8000

# GPU resource requests and limits.
# The taint on inference nodes requires this toleration.
resources:
  requests:
    nvidia.com/gpu: 1
  limits:
    nvidia.com/gpu: 1

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

nodeSelector:
  private-ai-workspace/plane: inference

affinity: {}

# HPA settings — scale based on custom vLLM Prometheus metrics (M6).
# Requires:
#   - kube-prometheus-stack (observability chart)
#   - prometheus-adapter (cluster-addons chart, enabled in M6)
#   - vllm.metrics.serviceMonitor.enabled = true (below)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetQueueDepth: 10

# Prometheus metrics (M6).
# When serviceMonitor.enabled = true, the Prometheus Operator scrapes /metrics
# and prometheus-adapter exposes `vllm_num_requests_waiting` to the HPA.
metrics:
  serviceMonitor:
    enabled: false        # Enable when kube-prometheus-stack is installed.
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}  # e.g. release: observability — match your Prometheus selector.

# PodDisruptionBudget (M6) — protect the warm replica during voluntary
# disruptions (node drains, rolling updates). See docs/09-scaling-policy.md.
podDisruptionBudget:
  enabled: false          # Enable in prod where warm-pool > 0.
  minAvailable: 1
  # maxUnavailable: 1     # Alternative — set this OR minAvailable, not both.

# Persistent volume for model weights (optional).
# If model.id references Hugging Face, set modelWeights.enabled: false.
modelWeights:
  enabled: false
  storageClass: ""
  size: 100Gi
  accessMode: ReadWriteOnce

# Extra environment variables forwarded to vLLM.
extraEnv: []
# - name: HUGGING_FACE_HUB_TOKEN
#   valueFrom:
#     secretKeyRef:
#       name: hf-token
#       key: token

serviceAccount:
  create: true
  name: ""
  # Set from Terraform output: $(terraform -chdir=infra/terraform output -raw irsa_vllm_role_arn)
  irsaRoleArn: ""

# External Secrets wiring for the Hugging Face Hub token.
# Requires ESO to be installed (cluster-addons chart).
externalSecrets:
  enabled: false
  awsRegion: us-east-1
  # Set from Terraform output: $(terraform -chdir=infra/terraform output -raw hf_token_secret_name)
  hfTokenSecretName: ""
  refreshInterval: "12h"

# Network policy — restricts ingress to the control-plane namespace only.
# Requires the cluster CNI to enforce NetworkPolicy (VPC CNI with policy mode
# enabled, or Calico).  Set enabled: true in production.
networkPolicy:
  enabled: true
  # Namespace from which the control plane is allowed to call the inference service.
  controlPlaneNamespace: app

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"
