# deploy/values/dev/app.yaml
# Control-plane Helm overrides for the dev environment.
#
# Usage:
#   helm upgrade --install private-ai-workspace deploy/helm/private-ai-workspace \
#     --namespace app --create-namespace \
#     --set image.repository=<ECR_URL> \
#     --set image.tag=<GIT_SHA> \
#     -f deploy/values/dev/app.yaml
#
# Substitute the placeholder values below from Terraform outputs:
#   image.repository   → terraform output -raw ecr_control_plane_url
#   serviceAccount.irsaRoleArn → terraform output -raw irsa_app_role_arn
#   externalSecrets.secretsManagerSecretName → terraform output -raw app_config_secret_name
#   config.objectStorageBucket → terraform output -raw s3_artifacts_bucket

replicaCount: 1

image:
  repository: ""   # Set at deploy time from ECR URL
  tag: "latest"
  pullPolicy: Always

config:
  environment: development
  logLevel: INFO
  logFormat: json
  objectStorageBucket: "private-ai-workspace-dev-artifacts"   # terraform output -raw s3_artifacts_bucket
  inferenceBaseUrl: "http://vllm-inference.inference.svc.cluster.local:8000"
  secretsProvider: aws-secrets-manager
  otelEndpoint: ""             # Set to OTel Collector ClusterIP when observability stack is deployed
  # M11 agent tool framework. Enabled in dev with a deny-by-default allow-list:
  # only tenant-a.test (alice@tenant-a.test) may invoke the text_stats stub tool.
  # bob@tenant-b.test is intentionally NOT listed → cross-tenant denial coverage.
  # Operator kill-switch: set agentToolsEnabled=false to disable all tools.
  agentToolsEnabled: true
  agentToolsAllowlist: '{"tenant-a.test":["text_stats","text_stats_job","deep_research"]}'
  # M11 Job-sandbox: reach the tool-runner dispatcher; the shared token lives in
  # an app-namespace Secret (created out-of-band, like the HF token).
  agentToolsDispatcherUrl: "http://tool-runner-dispatcher.agent-jobs.svc.cluster.local:8090"
  agentToolsDispatcherTokenSecret: "tool-runner-dispatcher-token"
  # M12 MCP: enable with the pure stub server allow-listed for tenant-a.test.
  # bob@tenant-b.test is intentionally NOT listed → cross-tenant denial coverage.
  mcpEnabled: true
  mcpAllowlist: '{"tenant-a.test":["stub"]}'
  # M13 integrations: enable with the synthetic loopback fixture allow-listed for
  # tenant-a.test (bob@tenant-b.test NOT listed → cross-tenant denial coverage).
  # Credentials resolve from Secrets Manager via IRSA under the "dev" env prefix
  # (Terraform var.environment), which differs from the app ENVIRONMENT
  # ("development") — hence integrationsSecretEnv. Short TTL for fast rotation
  # validation. No INTEGRATIONS_FIXTURE_TOKEN → the real Secrets Manager path is
  # used, not the dev fixture-token shortcut.
  integrationsEnabled: true
  integrationsAllowlist: '{"tenant-a.test":["loopback","blocked_probe"]}'
  integrationsSecretEnv: "dev"
  integrationsSecretTtlS: 30

# M13 dev-only synthetic loopback fixture (fake in-cluster calendar provider).
integrationsFixture:
  enabled: true
  port: 8099
  token: "dev-loopback-token"   # the fixture's expected bearer (matches the SM secret)

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: observability   # Must match the Prometheus Operator's serviceMonitorSelector

ingress:
  enabled: true
  host: ""                     # Set to dev.yourdomain.com
  certificateArn: ""           # Set from ACM certificate ARN
  annotations: {}

serviceAccount:
  create: true
  irsaRoleArn: ""              # Set from: terraform output -raw irsa_app_role_arn
  annotations: {}

externalSecrets:
  enabled: true
  awsRegion: us-west-2         # Match var.aws_region in dev.tfvars
  secretsManagerSecretName: "" # Set from: terraform output -raw app_config_secret_name
  existingSecret: "private-ai-workspace-dev-app-secrets"
  refreshInterval: "5m"        # Shorter interval for dev iteration

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
