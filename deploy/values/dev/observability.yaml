# deploy/values/dev/observability.yaml
# Development overrides for the observability Helm chart.
# Usage: helm upgrade --install observability deploy/helm/observability \
#          --namespace monitoring --create-namespace \
#          -f deploy/values/dev/observability.yaml

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 3d
      retentionSize: "2GB"
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi

  grafana:
    adminPassword: "admin"  # Dev only — never commit real passwords.
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  alertmanager:
    enabled: false  # Disable alertmanager in dev to reduce resource use.
