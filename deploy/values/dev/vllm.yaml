# deploy/values/dev/vllm.yaml
# Development overrides for the vllm-inference Helm chart.
# Usage: helm upgrade --install vllm deploy/helm/vllm -f deploy/values/dev/vllm.yaml

# Service named so it resolves to the host the control plane expects
# (INFERENCE_BASE_URL = http://vllm-inference.inference...:8000). Issue #34:
# the default fullname (release "vllm") did NOT match.
fullnameOverride: vllm-inference

replicaCount: 1

image:
  tag: "v0.9.0"

model:
  # Qwen2.5-1.5B-Instruct (Apache-2.0) — UNGATED, so no HF token is needed, and
  # it fits a g5.xlarge (24GB) with room for the vLLM image on the default root
  # volume (issue #34: Mistral-7B was gated + too big for the default disk).
  id: "Qwen/Qwen2.5-1.5B-Instruct"
  # Stable alias the control plane targets (AGENT_LOOP_MODEL / chat "model"),
  # decoupled from the HF id.
  servedModelName: "default"
  dtype: "float16"
  maxModelLen: 8192
  tensorParallelSize: 1
  maxNumSeqs: 64

resources:
  requests:
    nvidia.com/gpu: 1
  limits:
    nvidia.com/gpu: 1

serviceAccount:
  create: true
  # Set from: terraform -chdir=infra/terraform output -raw irsa_vllm_role_arn
  irsaRoleArn: ""

externalSecrets:
  # Disabled: the dev model is ungated, so no Hugging Face token is required.
  # Re-enable (and set hfTokenSecretName + the HF token secret value) only if you
  # switch dev to a gated model.
  enabled: false
  awsRegion: us-west-2
  hfTokenSecretName: ""
  refreshInterval: "12h"

networkPolicy:
  enabled: true
  controlPlaneNamespace: app

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2          # Dev: small cap to control spend.
  targetQueueDepth: 10

metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: observability  # Match the Prometheus Operator selector in dev.

# No PDB in dev — single replica, warm pool is 0.
podDisruptionBudget:
  enabled: false

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

# Source the model id from a ConfigMap (env MODEL_ID) so the model-installer
# reconciler can swap the served model + restart. Served alias stays "default".
modelInstaller:
  enabled: true
