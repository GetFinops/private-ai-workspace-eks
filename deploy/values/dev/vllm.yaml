# deploy/values/dev/vllm.yaml
# Development overrides for the vllm-inference Helm chart.
# Usage: helm upgrade --install vllm deploy/helm/vllm -f deploy/values/dev/vllm.yaml

replicaCount: 1

image:
  tag: "v0.9.0"

model:
  # Mistral-7B-Instruct-v0.3 (Apache-2.0).
  # Gated on Hugging Face — accept the license at:
  #   https://huggingface.co/mistralai/Mistral-7B-Instruct-v0.3
  # then set the HF token secret in Secrets Manager before deploying.
  id: "mistralai/Mistral-7B-Instruct-v0.3"
  dtype: "float16"
  maxModelLen: 8192
  tensorParallelSize: 1
  maxNumSeqs: 64

resources:
  requests:
    nvidia.com/gpu: 1
  limits:
    nvidia.com/gpu: 1

serviceAccount:
  create: true
  # Set from: terraform -chdir=infra/terraform output -raw irsa_vllm_role_arn
  irsaRoleArn: ""

externalSecrets:
  enabled: true
  awsRegion: us-east-1
  # Set from: terraform -chdir=infra/terraform output -raw hf_token_secret_name
  hfTokenSecretName: ""
  refreshInterval: "12h"

networkPolicy:
  enabled: true
  controlPlaneNamespace: app

autoscaling:
  enabled: false

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"
